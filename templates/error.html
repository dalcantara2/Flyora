{% extends "base.html" %}

{% block title %}Flyora — Something Went Wrong{% endblock %}

{% block content %}
<div class="container page-section page-section--narrow error-page">

    <div class="error-page__icon">✈️</div>
    <h1 class="error-page__title">Flight Disruption</h1>

    <!-- 'message' is passed from the error handler in app.py -->
    <p class="error-page__message">
        {{ message if message else "An unexpected error occurred. Please try again." }}
    </p>

    <a href="{{ url_for('index') }}" class="btn btn--primary">Back to Home</a>

</div>
{% endblock %}
